name: Execute Weather & Military Safety News Data Pipeline (Python Engine)

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron은 UTC(협정세계시) 기준입니다. (KST = UTC + 9시간)
    # 한국 시간(KST) 매일 아침 04:40 = UTC 19:40 (전일)
    # 기상 및 조침 전 당일 기상청 최신 예보치로 1일 1회 무인 자동 갱신
    - cron: '40 19 * * *'

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Python Data Pipeline Script
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KMA_API_HUB_KEY: ${{ secrets.KMA_API_HUB_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python scripts/fetch_data.py

      - name: Commit and Push Updated Weather Data JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Pipeline Bot"
          git add data/latest_weather.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ [Automated Python] Update Military Weather & Incident News Data [skip ci]" && git push)
