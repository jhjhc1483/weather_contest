name: Execute Weather & Military Safety News Data Pipeline (Python Engine)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Python Data Pipeline Script
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KMA_API_HUB_KEY: ${{ secrets.KMA_API_HUB_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python scripts/fetch_data.py

      - name: Commit and Push Updated Weather Data JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Pipeline Bot"
          git add data/latest_weather.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "⚡ [Automated Python] Update Military Weather & Incident News Data [skip ci]" && git push)
